name: Build STS Fast Browser v1.0.112 APK
on:
  push:
    branches: [sts-fast-browser-v112-restore-replace-delete]
    paths:
      - 'sts-fast-browser-v112-source.zip'
      - '.github/workflows/sts-fast-browser-v112.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          echo "5b0b4813c2732c7069fe811f48a369ee9154ccefeeda5d98e9bf83ef5c9c0ef5  sts-fast-browser-v112-source.zip" | sha256sum -c -
          rm -rf sts-fast-browser
          mkdir sts-fast-browser
          unzip -q sts-fast-browser-v112-source.zip -d sts-fast-browser
          grep -q 'versionCode 113' sts-fast-browser/app/build.gradle
          grep -q "versionName '1.0.112'" sts-fast-browser/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK Platform 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test single-tap Replace and Delete
        shell: bash
        run: |
          set -euo pipefail
          python3 sts-fast-browser/review-tests/test-pdf-delete.py
          python3 sts-fast-browser/review-tests/test-pdf-five-tools.py
          python3 sts-fast-browser/review-tests/test-native-pdf-preview.py
          python3 sts-fast-browser/review-tests/test-pdf-scan-replace.py
          python3 sts-fast-browser/review-tests/test-text-select-range.py
      - name: Compile unsigned APK
        run: gradle -p sts-fast-browser :app:assembleRelease --no-daemon --stacktrace
      - name: Validate APK version and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=sts-fast-browser/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" | head -n 2
          sha256sum "$APK" > v112-unsigned-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: STS-Fast-Browser-v1.0.112-unsigned
          path: |
            sts-fast-browser/app/build/outputs/apk/release/app-release-unsigned.apk
            v112-unsigned-sha256.txt
          retention-days: 30
          if-no-files-found: error
