name: Inspect STS v114 password and source handling
on:
  push:
    branches: [sts-fast-browser-v114-password-pdf]
    paths: ['.github/workflows/sts-fast-browser-v114-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relevant existing source
        shell: bash
        run: |
          mkdir src
          unzip -q sts-fast-browser-v113-source.zip -d src
          V=src/app/src/main/java/com/sts/fastbrowser/PdfViewerActivity.java
          echo '@@@ PDF 70-155'
          sed -n '70,155p' "$V"
          echo '@@@ PDF 510-740'
          sed -n '510,740p' "$V"
          echo '@@@ PDF 750-820'
          sed -n '750,820p' "$V"
          echo '@@@ MAIN 1410-1500'
          sed -n '1410,1500p' src/app/src/main/java/com/sts/fastbrowser/MainActivity.java
          echo '@@@ ROUTER 140-225'
          sed -n '140,225p' src/app/src/main/java/com/sts/fastbrowser/IntentRouterActivity.java
