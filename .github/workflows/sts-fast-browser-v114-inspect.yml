name: Inspect STS v114 PDF error/save paths
on:
  push:
    branches: [sts-fast-browser-v114-password-pdf]
    paths: ['.github/workflows/sts-fast-browser-v114-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PDF errors and saving
        shell: bash
        run: |
          mkdir src; unzip -q sts-fast-browser-v113-source.zip -d src
          V=src/app/src/main/java/com/sts/fastbrowser/PdfViewerActivity.java
          echo '@@@ PDF 1155-1348'
          sed -n '1155,1348p' "$V"
          echo '@@@ PDF 434-520'
          sed -n '434,520p' "$V"
          echo '@@@ PDF 1-70'
          sed -n '1,70p' "$V"
