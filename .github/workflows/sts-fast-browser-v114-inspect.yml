name: Inspect v114 PDF regression assertion
on:
  push:
    branches: [sts-fast-browser-v114-password-pdf]
    paths: ['.github/workflows/sts-fast-browser-v114-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print regression test and affected methods
        shell: bash
        run: |
          mkdir -p src
          unzip -q sts-fast-browser-v113-source.zip -d src
          echo '@@@ DELETE TEST'
          nl -ba src/review-tests/test-pdf-delete.py | head -95
          echo '@@@ JAVACALLS'
          grep -nE 'showOpenError|openDocumentWithPassword|savePdfEdits|Text, Replace, Highlighter' src/app/src/main/java/com/sts/fastbrowser/PdfViewerActivity.java | head -50
