name: Build STS Fast Browser v1.0.118
on:
  push:
    branches: [sts-fast-browser-v118-save-unprotected]
    paths:
      - '.github/workflows/sts-fast-browser-v118.yml'
      - '.github/scripts/patch_sts_v118.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified source
        shell: bash
        run: |
          set -euo pipefail
          echo "0304c80cf28bc1042fed0b9081dfa251888aa5878d81d5a02ddeed7222a6bd77  sts-fast-browser-v117-source.zip" | sha256sum -c -
          rm -rf sts-fast-browser
          mkdir sts-fast-browser
          unzip -q sts-fast-browser-v117-source.zip -d sts-fast-browser
      - name: Patch PDF exports to remove password
        run: python3 .github/scripts/patch_sts_v118.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run PDF regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 sts-fast-browser/review-tests/test-pdf-five-tools.py
          python3 sts-fast-browser/review-tests/test-native-pdf-preview.py
          python3 sts-fast-browser/review-tests/test-pdf-scan-replace.py
          python3 sts-fast-browser/review-tests/test-pdf-delete.py
          python3 sts-fast-browser/review-tests/test-pdf-open-paths.py
          python3 sts-fast-browser/review-tests/test-blob-document-flow.py
      - name: Compile unsigned release APK
        run: gradle -p sts-fast-browser :app:assembleRelease --no-daemon --stacktrace
      - name: Create complete source archive and validate APK
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging sts-fast-browser/app/build/outputs/apk/release/app-release-unsigned.apk | head -n 2
          cd sts-fast-browser
          zip -qr ../STS-Fast-Browser-v1.0.118-SOURCE.zip . -x '*/build/*' '*/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: STS-Fast-Browser-v1.0.118-unsigned-source
          path: |
            sts-fast-browser/app/build/outputs/apk/release/app-release-unsigned.apk
            STS-Fast-Browser-v1.0.118-SOURCE.zip
          retention-days: 30
          if-no-files-found: error