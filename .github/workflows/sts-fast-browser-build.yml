name: Build STS Fast Browser APK

on:
  push:
    branches:
      - sts-fast-browser-build
    paths:
      - 'sts-fast-browser/**'
      - '.github/workflows/sts-fast-browser-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable debug APK
        run: gradle -p sts-fast-browser :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare downloadable APK chunks
        shell: bash
        run: |
          set -euo pipefail
          APK="sts-fast-browser/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p build-output
          rm -f build-output/STS-Fast-Browser-v1.0.0.apk.b64.part-*
          base64 -w 0 "$APK" | split -b 700000 -d -a 3 - build-output/STS-Fast-Browser-v1.0.0.apk.b64.part-
          sha256sum "$APK" | awk '{print $1}' > build-output/STS-Fast-Browser-v1.0.0.sha256
          stat -c%s "$APK" > build-output/STS-Fast-Browser-v1.0.0.size
          ls build-output/STS-Fast-Browser-v1.0.0.apk.b64.part-* | sed 's#build-output/##' > build-output/STS-Fast-Browser-v1.0.0.parts.txt

      - name: Save build output to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/
          if git diff --cached --quiet; then
            echo "No build output changes"
          else
            git commit -m "Build STS Fast Browser v1.0.0 APK"
            git push origin HEAD:sts-fast-browser-build
          fi
