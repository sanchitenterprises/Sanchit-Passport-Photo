name: Build STS Fast Browser APK

on:
  push:
    branches:
      - sts-fast-browser-build
    paths:
      - 'sts-fast-browser/**'
      - '.github/workflows/sts-fast-browser-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply v1.0.61 menu cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sts-fast-browser/app/src/main/java/com/sts/fastbrowser/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace('        pm.getMenu().add("Backup Settings");\n', '')
          s = s.replace('        pm.getMenu().add("Restore Settings");\n', '')
          s = s.replace('            if (t.equals("Backup Settings")) {\n                exportSettingsBackup();\n                return true;\n            }\n', '')
          s = s.replace('            if (t.equals("Restore Settings")) {\n                importSettingsBackup();\n                return true;\n            }\n', '')
          p.write_text(s, encoding="utf-8")
          g = Path("sts-fast-browser/app/build.gradle")
          t = g.read_text(encoding="utf-8")
          t = t.replace("versionCode 61", "versionCode 62")
          t = t.replace("versionName '1.0.60'", "versionName '1.0.61'")
          g.write_text(t, encoding="utf-8")
          PY

      - name: Build unsigned release APK
        run: gradle -p sts-fast-browser :app:assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned APK and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: STS-Fast-Browser-v1.0.29-unsigned
          path: |
            sts-fast-browser/app/build/outputs/apk/release/app-release-unsigned.apk
            /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error


      - name: Prepare complete source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-source/.github/workflows
          cp -a sts-fast-browser full-source/
          cp .github/workflows/sts-fast-browser-build.yml full-source/.github/workflows/
          cd full-source
          zip -r ../STS-Fast-Browser-v1.0.29-SOURCE.zip . >/dev/null

      - name: Upload complete source package
        uses: actions/upload-artifact@v4
        with:
          name: STS-Fast-Browser-v1.0.29-SOURCE
          path: STS-Fast-Browser-v1.0.29-SOURCE.zip
          if-no-files-found: error
