name: Build Sanchit Passport Photo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: ZIPALIGN release APK
        shell: bash
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -p -f -v 4             app/build/outputs/apk/release/app-release-unsigned.apk             app/build/outputs/apk/release/Sanchit-Passport-Photo-v1.2.1-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 -v 4             app/build/outputs/apk/release/Sanchit-Passport-Photo-v1.2.1-aligned-unsigned.apk             | tee app/build/outputs/apk/release/ZIPALIGN-VERIFY.txt
          "$BT/aapt" dump badging             app/build/outputs/apk/release/Sanchit-Passport-Photo-v1.2.1-aligned-unsigned.apk             > app/build/outputs/apk/release/AAPT-BADGING.txt

      - name: Upload aligned APK and validation
        uses: actions/upload-artifact@v4
        with:
          name: Sanchit-Passport-Photo-v1.2.1-aligned-unsigned
          path: |
            app/build/outputs/apk/release/Sanchit-Passport-Photo-v1.2.1-aligned-unsigned.apk
            app/build/outputs/apk/release/ZIPALIGN-VERIFY.txt
            app/build/outputs/apk/release/AAPT-BADGING.txt
          if-no-files-found: error
