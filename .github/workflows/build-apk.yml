name: Build STS DigiKit APK
on:
  push:
    branches: [ sts-digikit ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply package version
        run: |
          source app/version.properties
          sed -i "s/versionCode [0-9][0-9]*/versionCode $VERSION_CODE/" app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '$VERSION_NAME'/" app/build.gradle
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: STS-DigiKit-APK
          path: app/build/outputs/apk/debug/app-debug.apk
