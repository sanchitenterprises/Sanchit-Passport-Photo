name: Build STS DigiKit APK
on:
  push:
    branches: [ sts-digikit ]
    paths:
      - 'app/version.properties'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed release APK
        run: gradle clean assembleRelease

      - name: Verify release artifact
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Create full STS DigiKit backup package
        run: |
          source app/version.properties
          mkdir -p export/package
          cp app/build/outputs/apk/release/app-release.apk "export/package/STS-DigiKit-V${VERSION_NAME}.apk"
          git archive --format=zip --prefix="STS-DigiKit-Source-V${VERSION_NAME}/" --output="export/package/STS-DigiKit-Source-V${VERSION_NAME}.zip" HEAD
          APK_SHA=$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
          {
            echo "STS DigiKit"
            echo "Version: ${VERSION_NAME}"
            echo "Version Code: ${VERSION_CODE}"
            echo "Branch: sts-digikit"
            echo "Commit: ${GITHUB_SHA}"
            echo "Build: signed RELEASE"
            echo "APK SHA-256: ${APK_SHA}"
            echo "Contents: latest release APK + complete source project"
          } > export/package/BUILD_INFO.txt
          (
            cd export/package
            zip -r "../STS-DigiKit-All-Materials-V${VERSION_NAME}.zip" .
          )

      - uses: actions/upload-artifact@v4
        with:
          name: STS-DigiKit-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: STS-DigiKit-Latest-Materials
          path: |
            export/package/STS-DigiKit-V*.apk
            export/package/STS-DigiKit-Source-V*.zip
            export/package/BUILD_INFO.txt
            export/STS-DigiKit-All-Materials-V*.zip
