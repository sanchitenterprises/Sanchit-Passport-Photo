name: Build STS Fast Browser v1.0.107 APK

on:
  push:
    branches: [sts-fast-browser-v107-pdf-replace]
    paths:
      - 'sts-fast-browser-v107-source.zip'
      - '.github/workflows/sts-fast-browser-v107.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and isolate build
        shell: bash
        run: |
          set -euo pipefail
          echo "3ec91b25fa0bc5b272f59c5d1025fcf6addb9721a7a4884bacd75945ad6e7331  sts-fast-browser-v107-source.zip" | sha256sum -c -
          rm -rf sts-fast-browser
          mkdir sts-fast-browser
          unzip -q sts-fast-browser-v107-source.zip -d sts-fast-browser
          grep -q 'versionCode 108' sts-fast-browser/app/build.gradle
          grep -q "versionName '1.0.107'" sts-fast-browser/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile unsigned release
        run: gradle -p sts-fast-browser :app:assembleRelease --no-daemon --stacktrace
      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail
          APK=sts-fast-browser/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" | head -n 2
          sha256sum "$APK" > sts-fast-browser-v107-unsigned-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: STS-Fast-Browser-v1.0.107-unsigned
          path: |
            sts-fast-browser/app/build/outputs/apk/release/app-release-unsigned.apk
            sts-fast-browser-v107-unsigned-sha256.txt
          retention-days: 30
          if-no-files-found: error
