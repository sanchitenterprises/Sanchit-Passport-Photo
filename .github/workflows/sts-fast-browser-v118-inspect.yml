name: Review PDF save implementation v118
on:
  push:
    branches: [sts-fast-browser-v118-save-unprotected]
    paths: [.github/workflows/sts-fast-browser-v118-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read precise PDF save paths and encrypted viewer creation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sts117
          unzip -q sts-fast-browser-v117-source.zip -d /tmp/sts117
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sts117/app/src/main/java/com/sts/fastbrowser/PdfViewerActivity.java')
          a=p.read_text().splitlines()
          for lo,hi in [(445,565),(675,805),(875,935),(1017,1058),(1058,1094)]:
              print('START RANGE',lo,hi)
              for i in range(lo-1,min(hi,len(a))):print(f'{i+1}: {a[i]}')
          PY