plugins { id 'com.android.application'; id 'com.google.protobuf' }

def stableKeyB64 = file('sts-stable-key.b64')
def stableKeyFile = file("$rootDir/.sts-signing/sts-stable-key.jks")

def versionProps = new Properties()
def versionPropsFile = file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def stsVersionCode = (versionProps.getProperty('VERSION_CODE') ?: '83') as int
def stsVersionName = versionProps.getProperty('VERSION_NAME') ?: '1.0.82'
if (stableKeyB64.exists()) {
    stableKeyFile.parentFile.mkdirs()
    stableKeyFile.bytes = java.util.Base64.getDecoder().decode(stableKeyB64.text.trim())
}

android {
    namespace 'com.sts.digikit'
    compileSdk 36

    signingConfigs {
        stable {
            storeFile stableKeyFile
            storePassword 'STSDigiKit2026'
            keyAlias 'sts_digikit'
            keyPassword 'STSDigiKit2026'
        }
    }

    defaultConfig {
        applicationId 'com.sts.digikit'
        minSdk 24
        targetSdk 36
        versionCode stsVersionCode
        versionName stsVersionName
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
            debuggable true
        }
        release {
            signingConfig signingConfigs.stable
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                'META-INF/versions/**/OSGI-INF/MANIFEST.MF',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/LICENSE.md',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md'
            ]
        }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
}


protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.5' }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { option 'lite' }
            }
        }
    }
}
